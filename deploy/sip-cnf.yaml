# Deployment, Service, PodDisruptionBudget and HPA for sip-cnf.
# Rolling updates never drop below the full replica count (maxUnavailable: 0),
# and each old pod drains before it exits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sip-cnf
  labels: { app: sip-cnf }
spec:
  replicas: 3
  selector:
    matchLabels: { app: sip-cnf }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: sip-cnf }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      # must exceed DRAIN_SECONDS + preStop, or the kubelet SIGKILLs mid-drain
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: sip-cnf }
      containers:
        - name: sip-cnf
          image: ghcr.io/rizwan3659/sip-cnf:latest
          env:
            - { name: SIP_PORT, value: "5060" }
            - { name: HTTP_PORT, value: "8080" }
            - { name: DRAIN_SECONDS, value: "15" }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports:
            - { name: sip, containerPort: 5060, protocol: UDP }
            - { name: http, containerPort: 8080, protocol: TCP }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # small pause so endpoint removal starts before SIGTERM arrives
            preStop:
              sleep: { seconds: 3 }
          resources:
            requests: { cpu: 100m, memory: 16Mi }
            limits: { cpu: 500m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: sip-cnf
spec:
  selector: { app: sip-cnf }
  ports:
    - { name: sip, port: 5060, targetPort: sip, protocol: UDP }
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sip-cnf
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: sip-cnf }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sip-cnf
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: sip-cnf }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
